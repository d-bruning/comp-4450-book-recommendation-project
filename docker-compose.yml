version: "3.9"

services:

  api:

    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    volumes:
      - ./logs:/app/logs

  frontend:

    environment:
      API_URL: http://api:8000

    build:
      context: .
      dockerfile: Dockerfile.frontend

    ports:
      - "8501:8501"

    depends_on:
      - api

  monitoring:

    build:
      context: .
      dockerfile: Dockerfile.monitoring

    ports:
      - "8502:8502"

    volumes:
      - ./logs:/app/logs

    depends_on:
      - api
